image: node:12.16.0

buildBooks: &buildBooks
  step:
    name: 
      Build books
    script:
      - yarn install
      - yarn global add ewer
      - apt update
      - apt install -y libnspr4 libnss3 libnss3-tools libgl1-mesa-glx
      - wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sh /dev/stdin
      - mkdir ./kindlegen && cd ./kindlegen
      - wget http://kindlegen.s3.amazonaws.com/kindlegen_linux_2.6_i386_v2_9.tar.gz
      - tar xvfz kindlegen_linux_2.6_i386_v2_9.tar.gz
      - mv ./kindlegen /usr/local/bin
      - cd ..
      - ewer build --directory de --build $BITBUCKET_BUILD_NUMBER --commit $BITBUCKET_COMMIT
pipelines:
  default:
    - <<: *buildBooks

  branches:
    master:
      - <<: *buildBooks

clone:
  depth: 20


